ry；检查实际令牌对应的 App 安装范围或 PAT 仓库选择。", "fix": "使用限定到目标仓库、权限最小的 GitHub App 安装令牌，或适当的细粒度 PAT，并通过 secret 提供。"}, {"when": "失败只出现在 fork 的 pull_request 运行中", "reason": "这类运行的写权限通常会降为只读，声明 write 不一定能获得写令牌。", "check": "检查触发事件、PR 来源与该次运行的实际权限，不以仓库默认设置代替运行证据。", "fix": "让不可信 PR 仅执行只读检查；确需写操作时，设计独立且受信任的审批或发布流程。"}], "commands": [{"label": "为创建 issue 的作业声明最小权限", "language": "yaml", "code": "# 放入确实需要创建 issue 的 jobs.\u003cjob_id> 下\npermissions:\n  contents: read\n  issues: write", "kind": "fix", "note": "这是特定端点示例；其他 API 需要按其文档替换权限。片段本身不会创建 issue。"}], "cautions": ["403 也可能来自限流或其他策略；只有匹配本条信息时才按令牌权限排查。", "不要为解决此错误开放所有写权限，或把运行不可信 PR 代码的事件直接改为 pull_request_target。", "不要打印令牌或完整认证请求头。"], "sources": [{"title": "GitHub Docs — Troubleshooting the REST API", "url": "https://docs.github.com/en/rest/using-the-rest-api/troubleshooting-the-rest-api#resource-not-accessible"}, {"title": "GitHub Docs — Workflow syntax / permissions", "url": "https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions"}, {"title": "GitHub Docs — Use GITHUB_TOKEN for authentication", "url": "https://docs.github.com/en/actions/tutorials/authenticate-with-github_token"}], "verified_on": "2026-11-05", "verification": "docs-reviewed", "tags": ["github-actions", "github-token", "403", "最小权限", "fork"]}, {"id": "github-actions-secrets-in-if", "category": "ci", "tool": "GitHub Actions expressions", "error": "Unrecognized named-value: 'secrets'. Located at position 1 within expression", "aliases": ["Invalid workflow file secrets if", "secrets cannot be directly referenced in if"], "summary": "在 if 条件中直接引用 secrets 会遇到上下文限制。若要按 secret 是否存在来决定步骤是否运行，可先把它映射到作业环境变量。", "causes": [{"when": "步骤 if 写成 secrets.DEPLOY_TOKEN != ''", "reason": "secrets 上下文不能直接用于 if 条件。", "check": "定位报错的 YAML 行，确认这是步骤级 if，而非 action 的 with 或 env。", "fix": "在该作业 env 中映射 secret，然后在步骤 if 中判断 env 对应项。"}, {"when": "将同样的判断移到了 jobs.\u003cjob_id>.if 后仍无效", "reason": "作业级 if 与步骤级 if 可用的上下文不同；作业环境变量的方案不能直接搬到作业级判断。", "check": "按 Contexts package-lock.json' '*npm-shrinkwrap.json' '*yarn.lock' '*pnpm-lock.yaml'", "kind": "diagnostic", "note": "只列已被 Git 跟踪的锁文件；未提交或动态生成的文件需另查。"}, {"label": "修正 setup-node 的子目录锁文件输入", "language": "yaml", "code": "# 合并到已有 setup-node 步骤的 with 中；web 为占位子目录\nwith:\n  cache: npm\n  cache-dependency-path: web/package-lock.json", "kind": "fix", "note": "需先 checkout，且该文件确实存在；包管理器和锁文件应与项目一致。"}], "cautions": ["不要为消除此错误删除项目锁文件或临时伪造空锁文件。", "setup-node 缓存的是包管理器数据，并不缓存 node_modules，也不替代依赖安装。", "较新版本可能自动开启 npm 缓存；应检查实际 action 版本和输入。"], "sources": [{"title": "actions/setup-node — Caching global packages data", "url": "https://github.com/actions/setup-node#caching-global-packages-data"}, {"title": "actions/setup-node — cache-restore.ts", "url": "https://github.com/actions/setup-node/blob/main/src/cache-restore.ts"}], "verified_on": "2026-11-05", "verification": "docs-reviewed", "tags": ["github-actions", "setup-node", "cache", "lockfile", "monorepo"]}, {"id": "upload-artifact-name-conflict", "category": "ci", "tool": "actions/upload-artifact v4+", "error": "Failed to CreateArtifact: Received non-retryable error: Failed request: (409) Conflict: an artifact with this name already exists on the workflow run", "aliases": ["artifact with this name already exists", "upload-artifact 409 Conflict"], "summary": "同一次 workflow run 中重复创建了同名 artifact。v4 及其后的实现不支持把不同上传步骤当作对同一 artifact 的追加写入。", "causes": [{"when": "多个步骤或作业都上传且没有设置 name", "reason": "它们默认都使用 artifact 这个名称；即使上传的文件名不同也会冲突。", "check": "检查同次运行中所有上传步骤的 name，以及先前已成功创建的 artifact。", "fix": "合并文件后仅上传一次，或给每次上传分配不同且稳定的名称。"}, {"when": "matrix 中每个组合都用同一个 name", "reason": "各矩阵作业并行创建了相同的 artifact 名。", "check": "展开矩阵维度，确认每个有效组合是否能得到唯一名称。", "fix": "把区分组合的 matrix 维度加入 name；下载端同步使用新名称。"}], "commands": [{"label": "给矩阵上传设置唯一名称", "language": "yaml", "code": "# 合并到已有 upload-artifact 步骤的 with；要求矩阵含 os 和 node\nwith:\n  name: build-${{ matrix.os }}-node-${{ matrix.node }}\n  path: dist/", "kind": "fix", "note": "这是片段；请替换矩阵键与产物路径，并确保其他维度也不会产生重名。"}], "cautions": ["不 端期待 TLS 记录，收到的却可能是其他协议的数据；不同 OpenSSL 版本与返回内容可能报其他记录层错误。", "check": "对照服务的监听配置与端口说明，查看 curl -v 的实际目标及代理步骤。", "fix": "连接服务提供的正确 TLS 入口；若原本要求加密，不应直接把目标 URL 降级为 HTTP。"}, {"when": "SMTP 587 等通过协议命令升级 TLS 的服务", "reason": "把 STARTTLS 端口当作连接后立即握手的隐式 TLS 端口。", "check": "检查服务文档明确要求 STARTTLS 还是隐式 TLS，并用对应的 -starttls 参数诊断。", "fix": "在应用中启用该协议的 STARTTLS 流程，或使用服务明确提供的隐式 TLS 端口。"}, {"when": "通过代理时才出现", "reason": "把仅支持 HTTP CONNECT 的代理地址写成 https://，使客户端对代理本身发起了不受支持的 TLS。", "check": "核对代理供应方提供的协议与端口；HTTPS_PROXY 表示为 HTTPS 目标选择代理，不代表代理本身一定使用 TLS。", "fix": "按经确认的代理协议填写地址；目标站点仍保持 HTTPS 和证书校验。"}], "commands": [{"label": "查看 TLS 连接经过的端点与代理步骤", "language": "bash", "code": "curl -vI https://service.example:443/", "kind": "diagnostic", "note": "替换域名与实际 TLS 端口；日志可能包含凭据和内部信息，分享前脱敏。"}, {"label": "按 SMTP STARTTLS 方式诊断 587 端口", "language": "bash", "code": "openssl s_client -connect mail.example:587 -starttls smtp -servername mail.example -verify_hostname mail.example -verify_return_error \u003c/dev/null", "kind": "diagnostic", "note": "需 OpenSSL 3.0；mail.example 是占位域名。仅在服务说明要求 SMTP STARTTLS 时使用；其他协议需相应的 -starttls 值。"}, {"label": "仅在已确认 HTTP CONNECT 代理后修正代理协议", "language": "bash", "code": "curl --proxy http://proxy.example:8080 -I https://service.example/", "kind": "fix", "note": "替换为组织允许的代理和目标。此命令不降低目标 HTTPS 的验证要求；如果代理要求 HTTPS，应保留其正确协议并排查别处。"}], "cautions": ["报错函数名和错误号随 OpenSSL 版本变化，全文匹配可能漏检。", "不要一见 version 就强制启用旧 TLS 或降低加密等级。", "非 TLS 数据只是候选原因，须结合实际监听与代理配置证实。"], "sources": [{"title": "OpenSSL upstream issue #27293 — non-TLS server record errors", "url": "https://github.com/openssl/openssl/issues/27293"}, {"title": "OpenSSL 3.0 — openssl-s_client starttls", "url": "https://docs.openssl.org/3.0/man1/openssl-s_client/"}, {"title": "curl — proxy protocol and HTTPS_PROXY", "url": "https://curl.se/docs/manpage.html#--proxy"}], "verified_on": "2026-11-05", "verification": "docs-reviewed", "tags": ["openssl", "curl", "protocol", "starttls", "proxy", "https"]}, {"id": "python-ssl-certificate-verify-failed", "category": "tls", "tool": "Python 3.13 标准库 ssl；第三方 HTTP 库可能另有信任配置", "error": "ssl.SSLCertVerificationError: [SSL: CERTIFICATE_VERIFY_FAILED] certificate verify failed: unable to get local issuer certificate", "aliases": ["SSLCertVerificationError", "CERTIFICATE_VERIFY_FAILED", "ssl.CertificateError"], "summary": "Python 的证书验证失败；这里重点排查无法找到签发者的子信息。应读取 verify_code 和 verify_message，不能把所有 CERTIFICATE_VERIFY_FAILED 都当成本机缺 CA。", "causes": [{"when": "新建 Python 环境或容器失败，其他环境正常", "reason": "该解释器的 OpenSSL 默认 CA 文件或目录可能缺失、被错误环境变量覆盖，或未包含组织 CA。", "check": "在出错解释器中打印 OpenSSL 版本、默认验证路径与实际异常的 verify_message。", "fix": "按解释器或系统发行方说明修复 CA 安装；内部 CA 已核验时，可在默认 context 基础上用 load_verify_locations 添加。"}, {"when": "多个客户端都在同一站点失败", "reason": "服务端可能缺少必要的中间证书，而非 Python 安装损坏。", "check": "检查服务端发送的链，与 CA 提供的中间证书链对照。", "fix": "由服务端维护者部署正确中间链；不要以更换客户端信任库代替服务端修复。"}], "commands": [{"label": "确认实际解释器和默认验证路径", "language": "bash", "code": "python -c \"import sys, ssl; print(sys.executable); print(ssl.OPENSSL_VERSION); print(ssl.get_default_verify_paths())\"", "kind": "diagnostic", "note": "python 应替换为实际运行应用的解释器；路径为 None 是线索，不单独证明全部系统信任库不可用。"}, {"label": "使用默认安全 context 读取精确验证错误", "language": "bash", "code": "python - \u003c\u003c'PY'\nimport socket, ssl\nhost = 'service.example'\ntry:\n    with socket.create_connection((host, 443), timeout=10) as raw:\n        with ssl.create_default_context().wrap_socket(raw, server_hostname=host) as tls:\n            print(tls.version())\nexcept ssl.SSLCertVerificationError as exc:\n    print(exc.verify_code, exc.verify_message)\n    raise SystemExit(1)\nPY", "kind": "diagnostic", "note": "将 service.example 替换为实际域名。此探测直连目标，不自动复用应用的 HTTP 代理或第三方库配置。"}, {"label": "在默认信任基础上添加已核验 CA 的代码模板", "language": "text", "code": "import ssl\ncontext = ssl.create_default_context()\ncontext.load_verify_locations(cafile='/path/to/verified-company-ca.pem')\n# 将 context 传给应用所用客户端支持的 SSLContext 参数。", "kind": "fix", "note": "这是 Python 代码模板，不是 shell 命令；替换 CA 文件路径并按客户端 API 接入。保留默认主机名及证书验证。 数据；在已修复且已核验来源后执行，不安装或升级软件包。"}], "cautions": ["不要默认关闭仓库认证或把仓库标记为无条件可信。", "不要只凭 NO_PUBKEY 后面的 ID 从任意 keyserver 导入密钥；必须验证仓库身份与完整指纹。", "The repository is not signed 还可能源于确实没有 Release 签名，本条只覆盖同时出现 NO_PUBKEY 的场景。", "密钥文件需要 _apt 可读，但不应因此递归放宽系统目录权限。"], "sources": [{"title": "Debian bookworm — apt-secure(8)", "url": "https://manpages.debian.org/bookworm/apt/apt-secure.8.en.html"}, {"title": "Debian bookworm — sources.list(5), Signed-By", "url": "https://manpages.debian.org/bookworm/apt/sources.list.5.en.html"}, {"title": "Debian Wiki — SecureApt and NO_PUBKEY", "url": "https://wiki.debian.org/SecureApt"}], "verified_on": "2026-11-05", "verification": "docs-reviewed", "tags": ["apt", "debian", "gpg", "signature", "keyring", "repository"]}, {"id": "npm-ci-lockfile-mismatch", "category": "packages", "tool": "npm ci；规则按 npm 11 文档审核", "error": "npm error `npm ci` can only install packages when your package.json and package-lock.json or npm-shrinkwrap.json are in sync", "aliases": ["npm ci EUSAGE", "Missing from lock file", "Invalid: lock file", "npm ci lockfile out of sync"], "summary": "npm ci 要求清单与现有锁文件一致，发现差异时会退出而不会替你更新锁文件。应先确认遗漏的锁文件变更或本地与 CI 的安装配置差异。", "causes": [{"when": "修改 package.json 后 CI 才失败", "reason": "未更新或未提交对应的 package-lock.json；也可能根本没有提交 ci 需要的锁文件。", "check": "查看清单与锁文件的 Git 差异，以及 npm ci 输出的 Missing 或 Invalid 项。", "fix": "在开发环境用团队约定的 npm 版本执行 npm install，审查并提交清单与锁文件后再运行 CI。"}, {"when": "锁文件存在，但本地能装、CI 不能装", "reason": "创建锁文件时使用了影响树形状的选项，而 CI 的 npm ci 未使用同样配置。", "check": "比较 npm 版本和项目 .npmrc，特别是 install-links、legacy-peer-deps 等历史配置。", "fix": "统一已评估的项目配置并提交必要配置；若历史上忽略了 peer 约束，评估真实兼容性后修正依赖。"}], "commands": [{"label": "查看依赖文件变更和 npm 版本", "language": "bash", "code": "npm --version\ngit diff -- package.json package-lock.json npm-shrinkwrap.json .npmrc", "kind": "diagnostic", "note": "在项目根目录执行；没有工作区 diff 不代表提交历史或 CI checkout 一定正确。"}, {"label": "在开发环境同步并审查依赖锁", "language": "bash", "code": "npm install\ngit diff -- package.json package-lock.json npm-shrinkwrap.json", "kind": <script>(function (root) {
  'use strict';
  function normalize(value) {
    return String(value).toLowerCase().replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, ' ').trim();
  }
  function score(entry, query) {
    const q = normalize(query);
    if (!q) return 1;
    const needles = [entry.error, ...entry.aliases].map(normalize);
    if (needles.some(n => q === n)) return 100;
    if (needles.some(n => n.length >= 8 && q.includes(n))) return 90;
    if (needles.some(n => n.includes(q))) return 80;
    const corpus = normalize(JSON.stringify(entry));
    if (corpus.includes(q)) return 50;
    return q.split(' ').every(w => corpus.includes(w)) ? 20 : 0;
  }
  function search(entries, query, category = 'all') {
    return entries.filter(e => category === 'all' || e.category === category)
      .map(entry => ({ entry, score: score(entry, query) })).filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score || a.entry.id.localeCompare(b.entry.id)).map(x => x.entry);
  }
  const api = { normalize, score, search };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ErrorAtlasSearch = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

      const pre = el('pre'); const code = el('code', cmd.code); pre.append(code);
      button.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(cmd.code); button.textContent = '已复制'; }
        catch { const range = document.createRange(); range.selectNodeContents(code); const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range); button.textContent = '已选中，请手动复制'; }
      });
      head.append(el('h4', `${cmd.kind === 'diagnostic' ? '诊断' : '修复'} · ${cmd.label}`), button);
      box.append(head, el('p', cmd.note, 'code-note'), pre); body.append(box);
    });
    if (entry.cautions.length) {
      body.append(el('h3', '边界与注意事项')); const list = el('ul');
      entry.cautions.forEach(s => list.append(el('li', s))); body.append(list);
    }
    body.append(el('h3', '官方依据')); const list = el('ul');
    entry.sources.forEach(source => { const li=el('li'); const a=el('a',source.title); a.href=source.url; a.target='_blank'; a.rel='noopener noreferrer'; li.append(a); list.append(li); });
    body.append(list, el('p', `条目 ID：${entry.id}`, 'code-note'));
    if (!dialog.open) dialog.showModal();
    dialog.scrollTop = 0;
    if (updateHash) location.hash = entry.id;
  }
  function render() {
    const found = ErrorAtlasSearch.search(entries, query.value, category);
    results.replaceChildren();
    document.getElementById('result-count').textContent = `${found.length} 条匹配 / ${entries.length} 条收录`;
    document.querySelectorAll('.filter').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.category === category)));
    if (!found.length) {
      const empty=el('div', undefined, 'empty'); empty.append(el('h2','暂时没有匹配的条目'),el('p','尝试保留错误码或核心短语，去掉时间戳、路径和变量值，或者切换到“全部”。')); results.append(empty);
    }
    found.forEach(entry => {
      const card=el('article',undefined,'card');
      const meta=el('div',undefined,'meta'); meta.append(el('span',categories[entry.category],'badge'),el('span',entry.tool));
      const bottom=el('div',undefined,'card-bottom'); const button=el('button','查看确认与修复 ↗','open-entry'); button.type='button'; button.setAttribute('aria-label','查看：'+entry.error); button.addEventListener('click',()=>openEntry(entry));
      bottom.append(button,el('span',entry.verified_on,'date'));
      card.append(meta,el('h2',entry.error),el('p',entry.summary),bottom); results.append(card);
    });
  }
  Object.entries(categories).forEach(([id, label]) => {
    const button=el('button',label,'filter'); button.type='button'; button.dataset.category=id;
    button.append(el('small',String(id==='all'?entries.length:entries.filter(e=>e.category===id).length)));
    button.addEventListener('click',()=>{category=id;render();}); document.getElementById('filters').append(button);
  });
  document.getElementById('total-count').textContent=entries.length;
  query.addEventListener('input',render);
  document.getElementById('clear').addEventListener('click',()=>{query.value='';render();query.focus();});
  document.querySelectorAll('.examples button').forEach(button=>button.addEventListener('click',()=>{query.value=button.textContent;category='all';render();}));
  document.getElementById('close').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('close',()=>{if(location.hash) history.replaceState(null,'',location.pathname+location.search);});
  function fromHash() {let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const entry=entries.find(e=>e.id===id);if(entry)openEntry(entry,false);else if(dialog.open)dialog.close();}
  window.addEventListener('hashchange',fromHash);
  render(); fromHash();
})();
</script>
</body>
</html>
