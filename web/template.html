<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="报错译本：把难懂的报错翻译成可验证的原因和修复步骤。离线可用，无账户，无日志上传。">
<title>Error Atlas · 报错译本</title>
<style>
:root{--bg:#101314;--panel:#191d1e;--line:#303738;--text:#edf0eb;--muted:#a5b1ad;--accent:#c2ee8a;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}button,input,textarea{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header,main,footer{max-width:1160px;margin:auto;padding-left:32px;padding-right:32px}header{display:flex;align-items:center;justify-content:space-between;min-height:92px;border-bottom:1px solid var(--line)}.brand{font-family:var(--mono);font-size:18px;letter-spacing:-.5px}.brand span{color:var(--accent)}.status{font:12px var(--mono);color:var(--muted)}.status::before{content:'●';color:var(--accent);margin-right:8px}.hero{padding:60px 0 32px;display:grid;grid-template-columns:1fr 260px;gap:48px;align-items:end}.eyebrow{font:12px var(--mono);letter-spacing:2px;color:var(--accent);margin-bottom:20px}h1{font-size:clamp(36px,5vw,60px);line-height:1.18;letter-spacing:-2px;font-weight:650;margin:0 0 20px}h1 span{color:var(--accent)}.intro{color:var(--muted);max-width:620px;margin:0;font-size:15px}.scope{border-left:1px solid var(--line);padding-left:26px;color:var(--muted);font-size:13px}.scope strong{font-size:38px;color:var(--text);font-weight:400;display:block;line-height:1.2;font-family:var(--mono)}.scope p{margin:8px 0}.search-box{position:relative;background:var(--panel);border:1px solid #536044;border-radius:10px;padding:16px 20px;display:flex;align-items:flex-start;gap:14px}.search-icon{font:24px var(--mono);color:var(--accent);padding-top:5px}.search-box textarea{resize:vertical;min-height:54px;max-height:180px;width:100%;border:0;outline:0;background:transparent;color:var(--text);font:15px/1.7 var(--mono);padding-top:5px}.search-box textarea::placeholder{color:#86928e}.clear{background:none;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:12px}.hint{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:16px;margin:10px 0 24px}.examples button{background:none;border:0;color:#c6d0cb;padding:0 6px;font:12px var(--mono);text-decoration:underline;text-underline-offset:3px}.filters{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:25px;border-bottom:1px solid var(--line)}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 14px;border-radius:6px;font-size:13px}.filter[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#1b2712}.filter small{margin-left:7px;opacity:.75}.results-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:26px 0 18px;font-size:12px;color:var(--muted)}.results-head strong{color:var(--text);font-weight:500}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);background:var(--panel);padding:24px;border-radius:9px;display:flex;flex-direction:column;align-items:flex-start}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:11px var(--mono);color:var(--muted)}.badge{color:var(--accent);font-family:system-ui;font-size:11px;background:#243020;border-radius:4px;padding:2px 6px}.card h2{font:16px/1.6 var(--mono);overflow-wrap:anywhere;margin:16px 0 10px}.card p{font-size:14px;color:#bdc7c2;margin:0 0 22px}.card-bottom{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;margin-top:auto}.open-entry{border:0;background:none;color:var(--accent);padding:0;font-size:13px}.date{color:#93a09a;font:11px var(--mono)}.empty{border:1px dashed var(--line);padding:52px 24px;text-align:center;color:var(--muted);border-radius:8px;grid-column:1/-1}.empty h2{color:var(--text)}footer{display:flex;justify-content:space-between;gap:18px;border-top:1px solid var(--line);padding-top:24px;padding-bottom:32px;margin-top:44px;font-size:12px;color:var(--muted)}dialog{width:min(860px,calc(100% - 24px));max-height:90vh;padding:0;border:1px solid #4b574e;border-radius:12px;background:var(--bg);color:var(--text)}dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}.dialog-top{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line);z-index:1}.dialog-top button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:5px;padding:5px 12px;font-size:13px}.entry-content{padding:12px 28px 30px}.entry-content h2{font:22px/1.5 var(--mono);overflow-wrap:anywhere}.entry-content h3{font-size:17px;margin:30px 0 12px}.entry-content p,.entry-content li{font-size:14px}.entry-content li{margin-bottom:8px}.entry-content a{color:var(--accent);overflow-wrap:anywhere}.entry-content .summary{font-size:16px;color:#d2dccf}.cause{border-left:2px solid #596e42;padding-left:18px;margin:20px 0}.cause h4{margin-bottom:10px;font-size:15px}.cause strong{color:var(--accent)}.code-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.code-head button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;font-size:12px;padding:4px 8px}.code-block pre{padding:16px;background:#090c0b;border:1px solid var(--line);border-radius:6px;overflow-x:auto;font:12px/1.7 var(--mono)}.code-note{color:var(--muted)}.verification{font-size:12px!important;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:16px}.noscript{padding:30px;color:var(--accent)}@media(max-width:700px){header,main,footer{padding-left:18px;padding-right:18px}header{min-height:72px}.hero{display:block;padding-top:38px}.scope{display:none}.status{font-size:10px}.grid{grid-template-columns:1fr}.hint,footer{flex-direction:column}.card{padding:20px}.results-head{align-items:flex-start}.results-head span{max-width:150px;text-align:right}.entry-content{padding:12px 20px 24px}.dialog-top{padding:12px 20px}h1{letter-spacing:-1px}}
</style>
</head>
<body>
<header><div class="brand"><span>&gt;_</span> ERROR ATLAS</div><div class="status">LOCAL SEARCH · NO UPLOADS</div></header>
<main>
<section class="hero"><div><div class="eyebrow">报错译本 / COMMUNITY REFERENCE</div><h1>看懂报错，<br><span>再动手修。</span></h1><p class="intro">把难懂的错误信息，翻译成可验证的原因。<br>先确认环境与触发条件，再选择对应的最小修复。</p></div><aside class="scope"><strong id="total-count">—</strong><p>条文档核对记录 · 4 个分类</p><p>保留原始报错、适用条件与官方依据。</p></aside></section>
<label for="query" class="eyebrow" style="display:block;margin-bottom:10px">SEARCH THE ERROR</label>
<div class="search-box"><span class="search-icon" aria-hidden="true">⌕</span><textarea id="query" rows="2" spellcheck="false" placeholder="粘贴错误码、报错核心短语，或搜索工具名…"></textarea><button id="clear" class="clear" type="button">清空</button></div>
<div class="hint"><span>仅在本机检索，不发送或保存输入的日志。</span><span class="examples">试试 <button type="button">ERESOLVE</button><button type="button">certificate</button><button type="button">Permission denied</button></span></div>
<nav class="filters" aria-label="按分类筛选" id="filters"></nav>
<div class="results-head"><strong id="result-count" role="status" aria-live="polite"></strong><span>文档核对 ≠ 实机复现</span></div>
<section id="results" class="grid" aria-label="报错检索结果"></section>
<noscript><p class="noscript">此页面需要 JavaScript。也可以直接阅读同目录 INDEX.md 与 entries/ 中的 Markdown 文档。</p></noscript>
</main>
<footer><span>ERROR ATLAS · 报错译本 · v0.1.0</span><span>报错是线索，环境决定原因。请按适用条件操作。</span></footer>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-top"><span class="eyebrow" style="margin:0">ERROR / DETAIL</span><button id="close" type="button" autofocus>关闭 ×</button></div><article class="entry-content" id="detail-content"></article></dialog>
<script type="application/json" id="catalog">__CATALOG_JSON__</script>
<script>/*__SEARCH_JS__*/</script>
<script>/*__APP_JS__*/</script>
</body>
</html>
